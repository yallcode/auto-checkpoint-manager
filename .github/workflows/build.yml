name: Build Geode Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: Build (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          target: ${{ matrix.config.target }}
          # We set this to false here so we can combine them all in the next job
          combine: false 

  package:
    name: Package Mod
    runs-on: ubuntu-latest
    needs: build # This tells GitHub to wait for all the builds above to finish

    steps:
      - name: Combine Artifacts
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - name: Upload Combined Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-checkpoint-manager-latest
          path: ${{ steps.combine.outputs.build-output }}